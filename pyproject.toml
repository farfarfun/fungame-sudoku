[project]
name = "fungame-sudoku"
version = "1.0.3"
description = "Sudoku puzzle generator and solver"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "farlog>=1.1.7"]

[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/fungame-sudoku"
Releases = "https://github.com/farfarfun/fungame-sudoku/releases"
[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-timeout>=2.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# README 里的 9x9 盘面是按行手工排版的，格式化器会把它压成每行一个数字，
# 不利于阅读；而 funbuild 发布流程会跑一次 `ruff format`，所以排除 Markdown。
extend-exclude = ["*.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/fungame"]

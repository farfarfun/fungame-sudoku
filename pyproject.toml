[project]
name = "fungame-sudoku"
version = "1.0.2"
description = "Sudoku puzzle generator and solver"
readme = "README.md"
requires-python = ">=3.6"
dependencies = ["numpy"]

[dependency-groups]
dev = ["pytest", "pytest-timeout"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fungame"]
